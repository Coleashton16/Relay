<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Relay - Professional Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #4F46E5; --bg: #F8FAFC; }
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
        
        .app-container { 
            height: 100dvh; width: 100vw; max-width: 480px; margin: 0 auto; 
            background: white; position: relative; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .premium-card { background: white; border: 1px solid #F1F5F9; border-radius: 2rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); }
        
        .calendar-day { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .selected-day { border: 2px solid var(--primary) !important; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .modal-slide-up { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100; }
        .modal-slide-up.active { transform: translateY(0); }

        .tab-bar { background: rgba(255, 255, 255, 0.85); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid rgba(0,0,0,0.08); }
        
        #toast { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 9999; }

        @keyframes pulse-indigo {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        .pulse-plan { animation: pulse-indigo 2s infinite; }

        .status-dot { width: 4px; height: 4px; border-radius: 50%; }
        .bg-free { background-color: #10B981; }
        .bg-shift { background-color: #EF4444; }
        .bg-busy { background-color: #F59E0B; }
    </style>
</head>
<body>

    <!-- Toast UI -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-4 rounded-3xl text-[10px] font-black uppercase tracking-widest shadow-2xl opacity-0 pointer-events-none -translate-y-5 flex items-center gap-3 w-[85%] max-w-[400px] text-center justify-center">
        <i data-lucide="bell" class="w-4 h-4 text-indigo-400"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- App Shell -->
    <div class="app-container">
        
        <!-- LOADING SCREEN -->
        <div id="screen-loading" class="absolute inset-0 bg-white z-[500] flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="w-12 h-12 border-4 border-slate-100 border-t-indigo-600 rounded-full animate-spin mb-6"></div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em]">Relay Cloud Sync</p>
        </div>

        <!-- AUTH SCREEN (Default) -->
        <section id="screen-auth" class="absolute inset-0 z-[400] bg-white flex flex-col px-8 pt-20 hidden">
            <div class="text-center mb-12">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-indigo-100/50">
                    <i data-lucide="zap" class="w-10 h-10"></i>
                </div>
                <h1 class="text-4xl font-black tracking-tighter text-slate-900 italic">Relay.</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-3">Identity Verified Planning</p>
            </div>

            <!-- Login View -->
            <div id="auth-login" class="space-y-4">
                <input type="email" id="login-email" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-3xl text-sm outline-none focus:border-indigo-400 focus:bg-white" placeholder="Email Address">
                <input type="password" id="login-pass" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-3xl text-sm outline-none focus:border-indigo-400 focus:bg-white" placeholder="Password">
                <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl active:scale-95 transition-transform">Sign In</button>
                <button onclick="toggleAuth('signup')" class="w-full text-[10px] font-black text-indigo-600 uppercase tracking-widest pt-4">Create New Account</button>
            </div>

            <!-- Signup View -->
            <div id="auth-signup" class="space-y-4 hidden overflow-y-auto no-scrollbar pb-10">
                <div class="flex flex-col items-center mb-4">
                    <label for="signup-avatar" class="cursor-pointer group relative">
                        <div class="w-24 h-24 rounded-full bg-slate-50 border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden">
                            <img id="signup-avatar-preview" src="" class="hidden w-full h-full object-cover">
                            <i data-lucide="camera" id="signup-avatar-icon" class="w-8 h-8 text-slate-300"></i>
                        </div>
                    </label>
                    <input type="file" id="signup-avatar" class="hidden" accept="image/*" onchange="previewAvatar(event, 'signup-avatar-preview')">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="signup-f" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-3xl text-sm" placeholder="First Name">
                    <input type="text" id="signup-l" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-3xl text-sm" placeholder="Last Name">
                </div>
                <input type="email" id="signup-e" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-3xl text-sm" placeholder="Email">
                <input type="password" id="signup-p" class="w-full bg-slate-50 border border-slate-100 p-5 rounded-3xl text-sm" placeholder="Password (6+ Characters)">
                <button onclick="handleSignup()" class="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black uppercase text-xs tracking-widest shadow-xl active:scale-95 transition-transform">Create Account</button>
                <button onclick="toggleAuth('login')" class="w-full text-[10px] font-black text-slate-400 uppercase py-2">Back to Login</button>
            </div>
        </section>

        <!-- SETUP SCREEN (No Relay Joined) -->
        <section id="screen-setup" class="absolute inset-0 z-[300] bg-white flex flex-col px-8 pt-20 hidden">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-black text-slate-900 tracking-tight italic uppercase">Relays</h2>
                <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-2">No active team detected</p>
            </div>
            
            <div id="setup-relay-list" class="space-y-3 mb-8 max-h-[300px] overflow-y-auto no-scrollbar"></div>

            <div class="mt-auto pb-10 space-y-4">
                <div class="premium-card p-6 border-indigo-100 bg-indigo-50/20">
                    <label class="text-[10px] font-black text-indigo-600 uppercase mb-3 block text-center tracking-widest">Join Team</label>
                    <input type="text" id="join-code" class="w-full bg-white border border-indigo-100 p-4 rounded-2xl text-center text-xl font-mono font-black uppercase tracking-widest outline-none" placeholder="CODE">
                    <button onclick="handleJoin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest mt-3 active:scale-95">Link Relay</button>
                </div>
                
                <div class="premium-card p-6">
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-3 block text-center tracking-widest">Create Relay</label>
                    <input type="text" id="new-name" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl text-center text-sm font-bold" placeholder="Relay Name">
                    <button onclick="handleCreate()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest mt-3 shadow-lg active:scale-95">Launch Relay</button>
                </div>
            </div>
        </section>

        <!-- DASHBOARD SCREEN -->
        <section id="screen-dash" class="absolute inset-0 flex flex-col hidden">
            <header class="bg-white px-6 pt-12 pb-5 flex items-center justify-between border-b border-slate-50 shrink-0">
                <div class="flex items-center gap-4">
                    <button onclick="openModal('modal-settings')" class="w-11 h-11 bg-slate-50 rounded-2xl flex items-center justify-center overflow-hidden border border-slate-100 shadow-sm">
                        <img id="dash-avatar" src="" class="hidden w-full h-full object-cover">
                        <i id="dash-avatar-icon" data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                    </button>
                    <div>
                        <h2 id="dash-relay-name" class="text-sm font-black text-slate-900 uppercase tracking-tight leading-none mb-1">---</h2>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">Code: <span id="dash-relay-code" class="text-indigo-600 font-mono">XXXXX</span></p>
                    </div>
                </div>
                <button onclick="setScreen('screen-setup')" class="w-10 h-10 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400">
                    <i data-lucide="grid" class="w-4 h-4"></i>
                </button>
            </header>

            <main class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6 pb-40">
                <!-- Calendar Card -->
                <section class="premium-card p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 id="cal-month" class="text-sm font-black text-slate-900 uppercase tracking-widest italic">Month</h3>
                        <div class="flex gap-2">
                            <button onclick="modMonth(-1)" class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                            <button onclick="modMonth(1)" class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-1.5 mb-2 text-center text-[8px] font-black text-slate-300 uppercase">
                        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                    </div>
                    <div id="cal-grid" class="grid grid-cols-7 gap-y-3 gap-x-1.5"></div>
                </section>

                <!-- Day Details Card -->
                <section class="premium-card p-6 min-h-[300px] flex flex-col">
                    <div id="day-empty" class="flex-1 flex flex-col items-center justify-center text-slate-300 py-10">
                        <i data-lucide="calendar" class="w-8 h-8 mb-3 opacity-20"></i>
                        <p class="text-[10px] font-black uppercase tracking-[0.3em]">Pick a Date</p>
                    </div>

                    <div id="day-content" class="hidden flex flex-col h-full">
                        <div class="text-center mb-6">
                            <p id="detail-date" class="text-xs font-black text-indigo-600 uppercase tracking-[0.4em]">Date Label</p>
                        </div>

                        <!-- Consensus Logic UI -->
                        <div id="plan-section" class="mb-8">
                            <button id="btn-propose" onclick="handlePropose()" class="w-full bg-indigo-600 text-white py-4 rounded-3xl font-black uppercase text-[10px] tracking-widest shadow-xl flex items-center justify-center gap-2 transition-all">
                                <i data-lucide="send" class="w-4 h-4 -rotate-45"></i> Propose Plan
                            </button>

                            <div id="plan-ui" class="hidden p-5 rounded-[2rem] bg-slate-50 border border-slate-100 flex flex-col gap-4">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h4 id="plan-status" class="text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full w-max mb-1 text-white">Pending</h4>
                                        <p id="plan-meta" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">---</p>
                                    </div>
                                    <div id="plan-count" class="text-2xl font-black text-slate-900 italic">0/0</div>
                                </div>
                                <div id="plan-actions" class="grid grid-cols-2 gap-2">
                                    <button id="btn-accept" onclick="handlePlanResp('accept')" class="bg-indigo-600 text-white py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest">Accept</button>
                                    <button id="btn-reject" onclick="handlePlanResp('reject')" class="bg-white text-rose-500 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest border border-rose-100">Reject</button>
                                </div>
                            </div>
                        </div>

                        <div class="flex-1">
                            <h4 class="text-[9px] font-black text-slate-400 uppercase tracking-[0.4em] mb-4 border-b border-slate-50 pb-2">Teammate Availability</h4>
                            <div id="day-members" class="space-y-2"></div>
                        </div>
                    </div>
                </section>
            </main>

            <!-- Bottom Availability Bar -->
            <div class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto p-6 pb-10 pointer-events-none">
                <div class="tab-bar rounded-[2.5rem] p-2 flex justify-between items-center shadow-2xl pointer-events-auto border border-white">
                    <button onclick="setStatus('free')" class="flex-1 py-4 flex flex-col items-center gap-1 group">
                        <div class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/40 active:scale-90 transition-transform shadow-lg shadow-emerald-200"></div>
                        <span class="text-[8px] font-black text-slate-600 uppercase tracking-widest">Free</span>
                    </button>
                    <div class="w-px h-8 bg-slate-200"></div>
                    <button onclick="setStatus('shift')" class="flex-1 py-4 flex flex-col items-center gap-1 group">
                        <div class="w-6 h-6 rounded-full bg-red-500 border-2 border-white/40 active:scale-90 transition-transform shadow-lg shadow-red-200"></div>
                        <span class="text-[8px] font-black text-slate-600 uppercase tracking-widest">Shift</span>
                    </button>
                    <div class="w-px h-8 bg-slate-200"></div>
                    <button onclick="setStatus('unavail')" class="flex-1 py-4 flex flex-col items-center gap-1 group">
                        <div class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white/40 active:scale-90 transition-transform shadow-lg shadow-amber-200"></div>
                        <span class="text-[8px] font-black text-slate-600 uppercase tracking-widest">Busy</span>
                    </button>
                    <div class="w-px h-8 bg-slate-200"></div>
                    <button onclick="setStatus(null)" class="flex-1 py-4 flex flex-col items-center gap-1 group">
                        <div class="w-6 h-6 rounded-full bg-slate-100 border-2 border-white active:scale-90 transition-transform"></div>
                        <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Reset</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- SETTINGS MODAL -->
        <section id="modal-settings" class="absolute inset-0 bg-slate-50 modal-slide-up flex flex-col">
            <header class="bg-white px-6 pt-12 pb-5 flex items-center justify-between border-b border-slate-100 shrink-0">
                <button onclick="closeModal('modal-settings')" class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">Done</button>
                <h3 class="text-sm font-black text-slate-900 uppercase tracking-widest italic">Management</h3>
                <div class="w-10"></div>
            </header>

            <div class="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6 pb-20">
                <!-- Profile Card -->
                <div class="premium-card p-6">
                    <h4 class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-4">Identity Sync</h4>
                    <div class="flex items-center gap-4 mb-6">
                        <label for="edit-avatar" class="cursor-pointer relative">
                            <div class="w-20 h-20 rounded-[2rem] bg-slate-100 overflow-hidden border border-slate-200 flex items-center justify-center">
                                <img id="set-avatar" src="" class="hidden w-full h-full object-cover">
                                <i data-lucide="camera" id="set-avatar-icon" class="w-6 h-6 text-slate-300"></i>
                            </div>
                            <input type="file" id="edit-avatar" class="hidden" accept="image/*" onchange="previewAvatar(event, 'set-avatar')">
                        </label>
                        <div class="flex-1 space-y-2">
                            <input type="text" id="set-fname" class="w-full bg-slate-100 border-none p-3 rounded-xl text-sm font-bold" placeholder="First Name">
                            <input type="text" id="set-lname" class="w-full bg-slate-100 border-none p-3 rounded-xl text-sm font-bold" placeholder="Last Name">
                        </div>
                    </div>
                    <button onclick="saveProfile()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest">Update Cloud Profile</button>
                </div>

                <!-- Relay Card -->
                <div class="premium-card p-6">
                    <h4 class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-4">Relay Controls</h4>
                    <div class="bg-slate-900 rounded-3xl p-5 text-center mb-6 shadow-xl">
                        <p class="text-[8px] font-black text-slate-500 uppercase tracking-widest mb-1">Invite Code</p>
                        <p id="set-code-display" class="text-4xl font-mono font-black text-white tracking-widest">XXXXX</p>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[8px] font-black text-slate-400 uppercase ml-1 block mb-2">Team Alias</label>
                            <div class="flex gap-2">
                                <input type="text" id="set-relay-name" class="flex-1 bg-slate-100 p-4 rounded-2xl text-sm font-bold border-none">
                                <button onclick="renameRelay()" class="bg-indigo-600 text-white px-6 rounded-2xl font-black uppercase text-[10px] tracking-widest">Save</button>
                            </div>
                        </div>
                        <div class="pt-4 border-t border-slate-50">
                            <p class="text-[8px] font-black text-slate-400 uppercase mb-3 text-center tracking-widest">Relay Roster</p>
                            <div id="set-members" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

                <div class="premium-card p-2 space-y-1">
                    <button onclick="handlePassReset()" class="w-full flex items-center justify-between p-5 text-slate-600 active:bg-slate-50 rounded-2xl transition-colors">
                        <span class="text-[10px] font-black uppercase tracking-widest">Secure Password Reset</span>
                        <i data-lucide="key" class="w-4 h-4 opacity-30"></i>
                    </button>
                    <button onclick="handleLeave()" class="w-full flex items-center justify-between p-5 text-rose-500 active:bg-rose-50 rounded-2xl transition-colors">
                        <span class="text-[10px] font-black uppercase tracking-widest">Leave Active Relay</span>
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-delete" onclick="handleDelete()" class="w-full flex items-center justify-between p-5 text-rose-600 active:bg-rose-50 rounded-2xl transition-colors hidden">
                        <span class="text-[10px] font-black uppercase tracking-widest">Terminate Relay (Admin)</span>
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>

                <button onclick="handleLogout()" class="w-full py-10 text-slate-300 font-black uppercase text-[10px] tracking-[0.5em] active:text-rose-500">End Session & Logout</button>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD8APWhg6rpIAslOAAnjpZM5tDoUAgsKBY",
            authDomain: "relay-8ad82.firebaseapp.com",
            projectId: "relay-8ad82",
            storageBucket: "relay-8ad82.firebasestorage.app",
            messagingSenderId: "912829496349",
            appId: "1:912829496349:web:e9130d03f97d5e6ffa1af4"
        };
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'relay-professional-v2';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Core State
        let currentU = null;
        let activeRid = localStorage.getItem('RELAY_RID');
        let selDate = null;
        let viewDate = new Date();

        // Synced Stores
        let profiles = {};
        let joinedRids = [];
        let curRelay = null;
        let members = [];
        let statuses = {};
        let plans = {};
        let unsubscribers = {};

        // UI Core
        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-5');
            t.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                t.classList.add('opacity-0', 'pointer-events-none', '-translate-y-5');
                t.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        };

        const setScreen = (id) => {
            ['screen-auth', 'screen-setup', 'screen-dash'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.getElementById('screen-loading').classList.add('opacity-0', 'pointer-events-none');
            lucide.createIcons();
        };

        window.toggleAuth = (mode) => {
            document.getElementById('auth-login').classList.toggle('hidden', mode === 'signup');
            document.getElementById('auth-signup').classList.toggle('hidden', mode === 'login');
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentU = user;
                initGlobalSync();
            } else {
                currentU = null;
                stopSync();
                setScreen('screen-auth');
            }
        });

        window.handleLogin = async () => {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-pass').value;
            try { 
                await signInWithEmailAndPassword(auth, e, p); 
            } catch (err) { 
                showToast(err.message.split(':').pop()); 
            }
        };

        window.handleSignup = async () => {
            const f = document.getElementById('signup-f').value;
            const l = document.getElementById('signup-l').value;
            const e = document.getElementById('signup-e').value;
            const p = document.getElementById('signup-p').value;
            const avatar = document.getElementById('signup-avatar-preview').src;
            
            if(!f || !e || p.length < 6) return showToast("Invalid Entry");

            try {
                const res = await createUserWithEmailAndPassword(auth, e, p);
                const data = { firstName: f, lastName: l, photo: avatar.includes('data:') ? avatar : '', email: e };
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', res.user.uid), data);
            } catch (err) { 
                showToast(err.message.split(':').pop()); 
            }
        };

        window.handleLogout = () => signOut(auth);

        const initGlobalSync = () => {
            // Profile Pool
            unsubscribers.profiles = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'profiles'), (s) => {
                s.forEach(d => profiles[d.id] = d.data());
                updateProfileUI();
                renderMembers();
                renderDay();
            });

            // My Membership Pool
            unsubscribers.relays = onSnapshot(collection(db, 'artifacts', appId, 'users', currentU.uid, 'relays'), (s) => {
                joinedRids = [];
                s.forEach(d => joinedRids.push(d.id));
                
                if (joinedRids.length === 0) {
                    activeRid = null;
                    localStorage.removeItem('RELAY_RID');
                    renderRelayList();
                    setScreen('screen-setup');
                } else {
                    if (!activeRid || !joinedRids.includes(activeRid)) {
                        activeRid = joinedRids[0];
                        localStorage.setItem('RELAY_RID', activeRid);
                    }
                    syncRelay();
                    renderRelayList();
                    setScreen('screen-dash');
                }
            });
        };

        const syncRelay = () => {
            if(!activeRid) return;

            ['meta', 'members', 'statuses', 'plans'].forEach(key => {
                if(unsubscribers[key]) unsubscribers[key]();
            });

            unsubscribers.meta = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'relays', activeRid), (d) => {
                if(d.exists()) {
                    curRelay = d.data();
                    document.getElementById('dash-relay-name').innerText = curRelay.name;
                    document.getElementById('dash-relay-code').innerText = activeRid;
                    document.getElementById('set-code-display').innerText = activeRid;
                    document.getElementById('set-relay-name').value = curRelay.name;
                    document.getElementById('btn-delete').classList.toggle('hidden', curRelay.creator !== currentU.uid);
                }
            });

            unsubscribers.members = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'relay_members'), (s) => {
                members = [];
                s.forEach(d => {
                    const dat = d.data();
                    if(dat.relayId === activeRid) members.push(dat.userId);
                });
                renderMembers();
                renderCal();
                renderDay();
            });

            unsubscribers.statuses = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'relay_statuses'), (s) => {
                statuses = {};
                s.forEach(d => {
                    const dat = d.data();
                    if(dat.relayId === activeRid) {
                        if(!statuses[dat.dateKey]) statuses[dat.dateKey] = {};
                        statuses[dat.dateKey][dat.userId] = dat.status;
                    }
                });
                renderCal();
                renderDay();
            });

            unsubscribers.plans = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'relay_plans'), (s) => {
                plans = {};
                s.forEach(d => {
                    const dat = d.data();
                    if(dat.relayId === activeRid) plans[dat.dateKey] = dat;
                });
                renderCal();
                renderDay();
            });
        };

        const stopSync = () => {
            Object.values(unsubscribers).forEach(u => u && u());
            unsubscribers = {};
        };

        window.handleCreate = async () => {
            const n = document.getElementById('new-name').value.trim() || 'New Relay';
            const code = Math.random().toString(36).substring(2, 7).toUpperCase();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relays', code), { creator: currentU.uid, name: n, createdAt: Date.now() });
                await setDoc(doc(db, 'artifacts', appId, 'users', currentU.uid, 'relays', code), { joinedAt: Date.now() });
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relay_members', `${code}_${currentU.uid}`), { relayId: code, userId: currentU.uid });
                activeRid = code;
                localStorage.setItem('RELAY_RID', code);
                document.getElementById('new-name').value = '';
                showToast("Relay Launched");
            } catch(e) { console.error(e); }
        };

        window.handleJoin = async () => {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            if(!code) return;
            try {
                const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relays', code));
                if(!snap.exists()) return showToast("Invalid Code");
                await setDoc(doc(db, 'artifacts', appId, 'users', currentU.uid, 'relays', code), { joinedAt: Date.now() });
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relay_members', `${code}_${currentU.uid}`), { relayId: code, userId: currentU.uid });
                activeRid = code;
                localStorage.setItem('RELAY_RID', code);
                document.getElementById('join-code').value = '';
                showToast("Relay Linked");
            } catch(e) { console.error(e); }
        };

        window.modMonth = (v) => { viewDate.setMonth(viewDate.getMonth() + v); renderCal(); };

        window.renderCal = () => {
            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';
            
            const y = viewDate.getFullYear();
            const m = viewDate.getMonth();
            document.getElementById('cal-month').innerText = viewDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            
            const start = new Date(y, m, 1).getDay();
            const days = new Date(y, m + 1, 0).getDate();

            for(let i=0; i<start; i++) grid.appendChild(document.createElement('div'));

            for(let i=1; i<=days; i++) {
                const dk = `${y}-${m+1}-${i}`;
                const dayStats = statuses[dk] || {};
                const plan = plans[dk];
                
                let hasBlocker = false;
                let freeCount = 0;
                members.forEach(uid => {
                    if(dayStats[uid] === 'shift' || dayStats[uid] === 'unavail') hasBlocker = true;
                    if(dayStats[uid] === 'free') freeCount++;
                });

                const el = document.createElement('div');
                let bg = 'bg-white border-slate-100 text-slate-700';
                
                if (plan && plan.status === 'confirmed') {
                    bg = 'bg-indigo-600 text-white border-indigo-700 shadow-lg';
                } else if (hasBlocker) {
                    bg = 'bg-slate-50 border-slate-100 text-slate-300';
                } else if (freeCount === members.length && members.length > 0) {
                    bg = 'bg-emerald-50 border-emerald-100 text-emerald-700';
                }

                if (dk === selDate) bg += ' selected-day';

                el.className = `calendar-day aspect-square rounded-2xl border flex flex-col items-center justify-center cursor-pointer overflow-hidden ${bg}`;
                el.innerHTML = `<span class="text-[11px] font-black">${i}</span>`;
                
                // Status Dots Row
                const dots = document.createElement('div');
                dots.className = "flex gap-0.5 mt-1";
                members.forEach(uid => {
                    const s = dayStats[uid];
                    if(s) {
                        const d = document.createElement('div');
                        d.className = `status-dot ${s==='free'?'bg-free':s==='shift'?'bg-shift':'bg-busy'}`;
                        dots.appendChild(d);
                    }
                });
                el.appendChild(dots);

                // Indicator Bar (Pending Plans)
                if (plan && plan.status !== 'confirmed') {
                    const bar = document.createElement('div');
                    bar.className = `absolute bottom-0 left-0 right-0 h-1 ${plan.status==='rejected'?'bg-rose-400':'bg-indigo-400'}`;
                    el.appendChild(bar);
                }

                el.onclick = () => {
                    selDate = dk;
                    document.getElementById('detail-date').innerText = new Date(y, m, i).toLocaleDateString('default', { weekday: 'long', month: 'short', day: 'numeric' });
                    renderCal();
                    renderDay();
                };
                grid.appendChild(el);
            }
        };

        window.setStatus = async (s) => {
            if(!selDate || !activeRid) return showToast("Select a day");
            const docId = `${activeRid}_${currentU.uid}_${selDate}`;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'relay_statuses', docId);
            try {
                if(!s) await deleteDoc(ref);
                else await setDoc(ref, { relayId: activeRid, userId: currentU.uid, dateKey: selDate, status: s, updated: Date.now() });
            } catch(e) { console.error(e); }
        };

        window.renderDay = () => {
            const empty = document.getElementById('day-empty');
            const cont = document.getElementById('day-content');
            if(!selDate) { empty.classList.remove('hidden'); cont.classList.add('hidden'); return; }
            
            empty.classList.add('hidden');
            cont.classList.remove('hidden');

            const dayStats = statuses[selDate] || {};
            const plan = plans[selDate];
            const list = document.getElementById('day-members');
            list.innerHTML = '';

            let blocks = false;
            members.forEach(uid => {
                const s = dayStats[uid];
                const p = profiles[uid] || { firstName: 'Syncing...' };
                if(s === 'shift' || s === 'unavail') blocks = true;

                let icon = '<div class="w-2 h-2 rounded-full bg-slate-200"></div>';
                if(plan) {
                    if(plan.acceptedBy?.includes(uid)) icon = '<i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>';
                    else if(plan.rejectedBy?.includes(uid)) icon = '<i data-lucide="x-circle" class="w-4 h-4 text-rose-500"></i>';
                }

                list.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-2xl bg-white border border-slate-50">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-slate-50 overflow-hidden border">
                                ${p.photo ? `<img src="${p.photo}" class="w-full h-full object-cover">` : `<i data-lucide="user" class="w-4 h-4 text-slate-300 m-2"></i>`}
                            </div>
                            <span class="text-[10px] font-black text-slate-700 uppercase">${p.firstName}${uid===currentU.uid?' (You)':''}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-[8px] font-black uppercase px-2 py-0.5 rounded-lg ${s==='free'?'bg-emerald-50 text-emerald-600':s==='shift'?'bg-red-50 text-red-600':s==='unavail'?'bg-amber-50 text-amber-600':'bg-slate-50 text-slate-400'}">
                                ${s||'Not Set'}
                            </div>
                            ${icon}
                        </div>
                    </div>
                `;
            });

            const btnProp = document.getElementById('btn-propose');
            const planUI = document.getElementById('plan-ui');
            
            if(plan) {
                btnProp.classList.add('hidden');
                planUI.classList.remove('hidden');
                
                const badge = document.getElementById('plan-status');
                const meta = document.getElementById('plan-meta');
                const cnt = document.getElementById('plan-count');
                const creator = profiles[plan.creatorId];

                meta.innerText = `Proposed by ${creator?.firstName || 'Sync...'}`;
                cnt.innerText = `${plan.acceptedBy?.length || 0}/${members.length}`;

                if(plan.status === 'confirmed') {
                    badge.innerText = 'Finalized';
                    badge.className = "text-[9px] font-black uppercase tracking-widest bg-emerald-500 text-white px-3 py-1 rounded-full w-max mb-1";
                    planUI.classList.remove('pulse-plan');
                    document.getElementById('plan-actions').classList.add('hidden');
                } else if(plan.status === 'rejected') {
                    badge.innerText = 'Vetoed';
                    badge.className = "text-[9px] font-black uppercase tracking-widest bg-rose-500 text-white px-3 py-1 rounded-full w-max mb-1";
                    planUI.classList.remove('pulse-plan');
                    document.getElementById('plan-actions').classList.remove('hidden');
                } else {
                    badge.innerText = 'Awaiting All';
                    badge.className = "text-[9px] font-black uppercase tracking-widest bg-indigo-600 text-white px-3 py-1 rounded-full w-max mb-1";
                    planUI.classList.add('pulse-plan');
                    document.getElementById('plan-actions').classList.remove('hidden');
                }

                document.getElementById('btn-accept').classList.toggle('opacity-30', plan.acceptedBy?.includes(currentU.uid));
                document.getElementById('btn-reject').classList.toggle('opacity-30', plan.rejectedBy?.includes(currentU.uid));
            } else {
                planUI.classList.add('hidden');
                btnProp.classList.remove('hidden');
                if(blocks) {
                    btnProp.disabled = true;
                    btnProp.className = "w-full bg-slate-100 text-slate-300 py-4 rounded-3xl font-black uppercase text-[10px] tracking-widest cursor-not-allowed flex items-center justify-center gap-2";
                    btnProp.innerHTML = `<i data-lucide="lock" class="w-4 h-4"></i> Availability Conflict`;
                } else {
                    btnProp.disabled = false;
                    btnProp.className = "w-full bg-indigo-600 text-white py-4 rounded-3xl font-black uppercase text-[10px] tracking-widest shadow-xl flex items-center justify-center gap-2 active:scale-95";
                    btnProp.innerHTML = `<i data-lucide="send" class="w-4 h-4 -rotate-45"></i> Propose Plan`;
                }
            }
            lucide.createIcons();
        };

        window.handlePropose = async () => {
            if(!selDate || !activeRid) return;
            const pid = `${activeRid}_${selDate}`;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relay_plans', pid), {
                    relayId: activeRid,
                    dateKey: selDate,
                    creatorId: currentU.uid,
                    status: members.length === 1 ? 'confirmed' : 'pending',
                    acceptedBy: [currentU.uid],
                    rejectedBy: [],
                    createdAt: Date.now()
                });
                showToast("Plan Dispatched");
            } catch(e) { console.error(e); }
        };

        window.handlePlanResp = async (type) => {
            const plan = plans[selDate];
            if(!plan) return;
            const pid = `${activeRid}_${selDate}`;
            
            let accepted = plan.acceptedBy || [];
            let rejected = plan.rejectedBy || [];
            
            accepted = accepted.filter(u => u !== currentU.uid);
            rejected = rejected.filter(u => u !== currentU.uid);
            
            if(type === 'accept') accepted.push(currentU.uid);
            else rejected.push(currentU.uid);
            
            let ns = 'pending';
            if(rejected.length > 0) ns = 'rejected';
            else if(accepted.length >= members.length) ns = 'confirmed';
            
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relay_plans', pid), {
                    acceptedBy: accepted,
                    rejectedBy: rejected,
                    status: ns
                });
            } catch(e) { console.error(e); }
        };

        const updateProfileUI = () => {
            const me = profiles[currentU.uid];
            if(!me) return;
            if(me.photo) {
                document.getElementById('dash-avatar').src = me.photo;
                document.getElementById('dash-avatar').classList.remove('hidden');
                document.getElementById('dash-avatar-icon').classList.add('hidden');
                document.getElementById('set-avatar').src = me.photo;
                document.getElementById('set-avatar').classList.remove('hidden');
                document.getElementById('set-avatar-icon').classList.add('hidden');
            }
            document.getElementById('set-fname').value = me.firstName;
            document.getElementById('set-lname').value = me.lastName;
        };

        window.saveProfile = async () => {
            const f = document.getElementById('set-fname').value;
            const l = document.getElementById('set-lname').value;
            const photo = document.getElementById('set-avatar').src;
            const data = { firstName: f, lastName: l, photo: photo.includes('data:') ? photo : (profiles[currentU.uid]?.photo || '') };
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', currentU.uid), data);
                showToast("Identity Synced");
            } catch(e) { console.error(e); }
        };

        window.renameRelay = async () => {
            const n = document.getElementById('set-relay-name').value.trim();
            if(!n || !activeRid) return;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relays', activeRid), { name: n });
                showToast("Alias Updated");
            } catch(e) { console.error(e); }
        };

        window.handlePassReset = () => {
            sendPasswordResetEmail(auth, currentU.email).then(() => showToast("Security Link Sent"));
        };

        window.previewAvatar = (e, targetId) => {
            const file = e.target.files[0];
            if(!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const img = document.getElementById(targetId);
                img.src = ev.target.result;
                img.classList.remove('hidden');
                if(targetId === 'signup-avatar-preview') document.getElementById('signup-avatar-icon').classList.add('hidden');
                else document.getElementById('set-avatar-icon').classList.add('hidden');
            };
            r.readAsDataURL(file);
        };

        window.renderRelayList = () => {
            const l = document.getElementById('setup-relay-list');
            l.innerHTML = joinedRids.map(code => `
                <button onclick="switchRelay('${code}')" class="w-full bg-white border border-slate-100 p-5 rounded-3xl text-left flex justify-between items-center active:scale-95 transition-transform">
                    <span class="text-[11px] font-black text-slate-800 uppercase tracking-widest italic">RELAY ${code}</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </button>
            `).join('');
            lucide.createIcons();
        };

        window.switchRelay = (c) => { activeRid = c; localStorage.setItem('RELAY_RID', c); syncRelay(); setScreen('screen-dash'); };

        window.renderMembers = () => {
            const list = document.getElementById('set-members');
            if(!list || !activeRid) return;
            list.innerHTML = '';
            const isAdm = curRelay?.creator === currentU.uid;

            members.forEach(uid => {
                const p = profiles[uid] || { firstName: 'User' };
                const isMe = uid === currentU.uid;
                list.innerHTML += `
                    <div class="flex items-center justify-between p-3 bg-slate-50 rounded-2xl">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-white overflow-hidden border">
                                ${p.photo ? `<img src="${p.photo}" class="w-full h-full object-cover">` : `<i data-lucide="user" class="w-3 h-3 text-slate-300 m-2.5"></i>`}
                            </div>
                            <span class="text-[10px] font-black text-slate-600 uppercase">${p.firstName}</span>
                        </div>
                        ${(isAdm && !isMe) ? `<button onclick="kick('${uid}')" class="text-rose-500 p-2"><i data-lucide="user-minus" class="w-4 h-4"></i></button>` : ''}
                    </div>
                `;
            });
            lucide.createIcons();
        };

        window.kick = async (uid) => {
            if(!confirm("Terminate member access?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relay_members', `${activeRid}_${uid}`));
                await deleteDoc(doc(db, 'artifacts', appId, 'users', uid, 'relays', activeRid));
            } catch(e) { console.error(e); }
        };

        window.handleDelete = async () => {
            if(!confirm("TERMINATE RELAY PERMANENTLY?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relays', activeRid));
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentU.uid, 'relays', activeRid));
                closeModal('modal-settings');
            } catch(e) { console.error(e); }
        };

        window.handleLeave = async () => {
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', currentU.uid, 'relays', activeRid));
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'relay_members', `${activeRid}_${currentU.uid}`));
                closeModal('modal-settings');
            } catch(e) { console.error(e); }
        };

        window.openModal = (id) => document.getElementById(id).classList.add('active');
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');

        lucide.createIcons();
    </script>
</body>
</html>
